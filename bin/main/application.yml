spring:
  application:
    name: vocably-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocably}
    username: ${DB_USER:vocably}
    password: ${DB_PASSWORD:vocably}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # One JSON convention for the whole API. Record components are named in camelCase, and this
  # strategy is set explicitly so a stray PascalCase or snake_case component name cannot leak a
  # second convention into the payloads again.
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3Itdm9jYWJseS1qd3QtYXV0aGVudGljYXRpb24tc2VydmljZQ==}
  access-expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    # Comma-separated list of exact browser origins. Must be exact, not a wildcard: the API sends
    # credentials (the refresh-token cookie), and a wildcard origin is invalid with those.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  auth:
    cookie:
      name: refreshToken
      path: /
      # Leave empty to scope the cookie to the exact API host.
      domain: ${REFRESH_COOKIE_DOMAIN:}
      secure: ${REFRESH_COOKIE_SECURE:true}
      # Lax works when the browser talks to the API same-site (directly, or through the client's
      # dev proxy). A split-domain deploy — app.example.com calling api.example.com — must set this
      # to None, which browsers only accept together with Secure.
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

    refresh-token:
      # Keeps the server-side whitelist of live refresh tokens in Redis, which is what makes logout
      # and theft containment real. Setting this to false drops the Redis dependency and with it
      # any ability to revoke a token before it expires — local convenience only.
      revocation-enabled: ${REFRESH_TOKEN_REVOCATION_ENABLED:true}

    password-reset:
      ttl: ${PASSWORD_RESET_TTL:PT30M}

  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.vocably: DEBUG
    org.hibernate.SQL: DEBUG
