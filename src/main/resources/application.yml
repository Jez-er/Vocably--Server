spring:
  application:
    name: vocably-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocably}
    username: ${DB_USER:vocably}
    password: ${DB_PASSWORD:vocably}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3Itdm9jYWJseS1qd3QtYXV0aGVudGljYXRpb24tc2VydmljZQ==}
  access-expiration: 900000
  refresh-expiration: 604800000

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.vocably: DEBUG
    org.hibernate.SQL: DEBUG
