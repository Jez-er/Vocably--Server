spring:
  application:
    name: vocably-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vocably}
    username: ${DB_USER:vocably}
    password: ${DB_PASSWORD:vocably}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  auth:
    cookie:
      name: refreshToken
      path: /
      domain: ${REFRESH_COOKIE_DOMAIN:}
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

    refresh-token:
      revocation-enabled: ${REFRESH_TOKEN_REVOCATION_ENABLED:true}

    password-reset:
      ttl: ${PASSWORD_RESET_TTL:PT30M}
      sweep-cron: ${PASSWORD_RESET_SWEEP_CRON:0 15 3 * * *}

  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.vocably: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
